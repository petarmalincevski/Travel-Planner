
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <script src="js/avt.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Voyara</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="destinacii.html" class="active">Destinations</a>
            <a href="anketa.html">Survey</a>
            <a href="blog.html">Blog</a>
        </nav>

        <div id="user-area">
            <a href="najava.html">Login</a>
            <a href="registracija.html">Register</a>
        </div>
    </header>


    <section class="container my-5">

        <div class="text-center mb-5">
            <h2>Explore Destinations</h2>
            <p>Discover amazing cities and plan your next adventure.</p>
        </div>

        <div class="row mb-4">

            <div class="col-md-6 mb-3">
                <label for="category-filter">Filter by category:</label>

                <select id="category-filter" class="form-control">
                    <option value="all">All categories</option>
                    <option value="Nature">Nature</option>
                    <option value="Culture">Culture</option>
                    <option value="Adventure">Adventure</option>
                    <option value="City">City</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label for="budget-filter">Filter by budget:</label>

                <select id="budget-filter" class="form-control">
                    <option value="all">All budgets</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

        </div>


        <div class="row" id="destinations-list">

        </div>
        <div class="mt-5 p-4" style="background-color: rgba(0,0,0,0.8); border-radius: 12px;">

            <h3 class="text-center mb-4">Add a New Destination</h3>

            <form id="destination-form">

                <div class="form-group">
                    <label for="destination-name">Destination name:</label>
                    <input type="text" id="destination-name" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="destination-description">Description:</label>
                    <textarea id="destination-description" class="form-control" required></textarea>
                </div>

                <div class="form-group">
                    <label for="destination-image">Image path:</label>
                    <input type="text" id="destination-image"
                           class="form-control"
                           placeholder="sliki/city.jpg"
                           required>
                </div>

                <div class="form-group">
                    <label for="destination-category">Category:</label>

                    <select id="destination-category" class="form-control" required>
                        <option value="Nature">Nature</option>
                        <option value="Culture">Culture</option>
                        <option value="Adventure">Adventure</option>
                        <option value="City">City</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="destination-budget">Budget:</label>

                    <select id="destination-budget" class="form-control" required>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-warning">
                    Add Destination
                </button>

                <p id="destination-message" class="mt-3"></p>

            </form>

        </div>

        <div class="mt-5 p-4" style="background-color: rgba(0,0,0,0.8); border-radius: 12px;">

            <h3 class="text-center mb-4">Travel Cost Calculator</h3>

            <form id="travel-form">

                <div class="form-group">
                    <label for="distance">Total distance in kilometers (km):</label>
                    <input type="number" id="distance" class="form-control"
                           min="1" step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="consumption">Car fuel consumption (liters per 100 km):</label>
                    <input type="number" id="consumption" class="form-control"
                           min="0.1" step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="fuel-price">Fuel price per liter (MKD):</label>
                    <input type="number" id="fuel-price" class="form-control"
                           min="0.1" step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="passengers">Number of passengers:</label>
                    <input type="number" id="passengers" class="form-control"
                           min="1" value="1" required>
                </div>

                <button type="submit" class="btn btn-warning">
                    Calculate Cost
                </button>

            </form>

            <h5 id="travel-result" class="text-center mt-4"></h5>

        </div>

    </section>


    <footer>
        <p>
            &copy; 2026 Voyara Travel Planner. All rights reserved.
        </p>
    </footer>


    <script src="js/destinacii.js"></script>

</body>
</html>
