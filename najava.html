<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Voyara</title>

    <link rel="stylesheet" href="style.css">
    <script src="js/avt.js" defer></script>
</head>

<body>
    <header>

        <h1>Voyara</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="destinacii.html">Destinations</a>
            <a href="anketa.html">Survey</a>
            <a href="blog.html">Blog</a>
        </nav>

        <div id="user-area">
            <a href="najava.html" class="active">Login</a>
            <a href="registracija.html">Register</a>
        </div>

    </header>
    <main class="login-page">

        <div class="login-box">

            <h2>Welcome Back!</h2>

            <p class="login-description">
                Login to your Voyara account and continue planning your next adventure.
            </p>

            <form id="login-form">

                <label for="login-email">Email Address</label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Enter your email"
                    required
                >

                <label for="login-password">Password</label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    required
                >

                <p id="login-message"></p>

                <button type="submit">Login</button>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="registracija.html">Register here</a>
            </p>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 Voyara. All rights reserved.</p>
    </footer>

</body>

</html>
