<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/auth.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Voyara</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/avt.js" defer></script>
</head>

<body>
    <header>

        <h1>Voyara</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="destinacii.html">Destinations</a>
            <a href="anketa.html">Survey</a>
            <a href="blog.html">Blog</a>
        </nav>

        <div id="user-area">
            <a href="najava.html">Login</a>
            <a href="registracija.html" class="active">Register</a>
        </div>

    </header>

    <main class="register-page">

        <div class="register-box">

            <h2>Create an Account</h2>

            <p class="register-description">
                Join Voyara and start planning your next adventure!
            </p>

            <form id="register-form">

                <label for="register-name">Full Name</label>
                <input
                    type="text"
                    id="register-name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="register-email">Email Address</label>
                <input
                    type="email"
                    id="register-email"
                    placeholder="Enter your email"
                    required
                >

                <label for="register-password">Password</label>
                <input
                    type="password"
                    id="register-password"
                    placeholder="Create a password"
                    required
                >

                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >

                <p id="register-message"></p>

                <button type="submit">Register</button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="najava.html">Login here</a>
            </p>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 Voyara. All rights reserved.</p>
    </footer>

</body>

</html>
